# What a release is: the server and the command line for one operating system, with the worker and the
# runner they start, in one archive that needs the .NET runtime and nothing else.
#
# Started by pushing a tag that begins with `v`, or by hand with a version, which then creates that tag.
# The archives are published only when every one of them was built and tried: a release with one
# operating system missing would look like a complete one.
#
# The reusable build runs the test suite and checks the installed NuGet tools. Each archive is also
# tried on its own operating system before either the archives or the packages are published.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v. Publishing creates the tag after all checks pass.
        required: true
        type: string
      dry_run:
        description: Build and verify release assets without publishing packages, a tag or a release.
        required: true
        type: boolean
        default: true
      verify_only:
        description: Verify NuGet trusted publishing without building or publishing anything.
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Settled once, so that the three archives are one version built against one state of the platform.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      stocksharp: ${{ steps.stocksharp.outputs.commit }}
    steps:
      - id: version
        env:
          TYPED: ${{ inputs.version }}
        run: |
          version="${TYPED:-${GITHUB_REF_NAME#v}}"

          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$version' is not a version. Write it as 1.2.3 or 1.2.3-beta.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check NuGet publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
          VERIFY_ONLY: ${{ inputs.verify_only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$VERIFY_ONLY" == 'true' && "$DRY_RUN" != 'true' ]]; then
            echo "::error::verify_only requires dry_run."
            exit 1
          fi
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Set NUGET_USER to the personal NuGet.org username whose Trusted Publishing policy permits release.yml. See docs/releasing.md."
            exit 1
          fi

      # The trading platform is built from source, at the tip of its master. Which commit that is has to
      # be the same for every archive, and master can move while they are being built.
      - id: stocksharp
        run: |
          commit="$(git ls-remote https://github.com/StockSharp/StockSharp.git refs/heads/master | cut -f1)"

          if [ -z "$commit" ]; then
            echo "::error::The master of StockSharp could not be read."
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  verify-nuget:
    name: Verify NuGet trusted publishing
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Report successful authentication
        run: echo "NuGet trusted publishing authentication succeeded. No packages were uploaded." >> "$GITHUB_STEP_SUMMARY"

  package:
    if: '!inputs.verify_only'
    needs: prepare
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: Odysseus
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: Odysseus

      - uses: actions/checkout@v7
        with:
          repository: StockSharp/StockSharp
          ref: ${{ needs.prepare.outputs.stocksharp }}
          path: 'StockSharp (GitHub)'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      # The server and the command line share a folder: what they both depend on is the same build of
      # the same files. The worker and the runner each get a folder of their own under the names the
      # hosts look for, because their dependencies are not the hosts'.
      #
      # No symbols, no documentation files and no translated compiler messages: a release is run, not
      # debugged or compiled against, and what it says is in English.
      - name: Publish
        run: |
          publish() {
            dotnet publish "src/Odysseus.$1/Odysseus.$1.csproj" --configuration Release --runtime "$RID" \
              --self-contained false --output "../dist/odysseus/$2" \
              -p:OdysseusVersion="$VERSION" -p:DebugType=none -p:DebugSymbols=false \
              -p:GenerateDocumentationFile=false -p:SatelliteResourceLanguages=en -p:PackAsTool=false
          }

          publish Server ""
          publish Cli ""
          publish Worker worker
          publish Runner runner

          cp LICENSE README.md ../dist/odysseus/
          cp -R samples schemas ../dist/odysseus/

      # Run out of the folder that is about to be archived, the way whoever unpacks it will. A backtest
      # starts the worker, and the worker is refused unless it carries the platform the host carries -
      # so this passing is the layout being right, not only the files being there.
      - name: Try the command line
        working-directory: dist/odysseus
        env:
          ODYSSEUS_PROJECTS_ROOT: ${{ runner.temp }}/odysseus-projects
          ODYSSEUS_MARKET_DATA: ${{ runner.temp }}/odysseus-market
        run: |
          ./odysseus new "release check"
          ./odysseus demo
          ./odysseus propose samples/hypothesis.json
          ./odysseus build
          ./odysseus backtest

      # The server answers while its input is open, so the input is held open for a moment after the
      # question instead of being closed behind it.
      - name: Try the server
        working-directory: dist/odysseus
        env:
          ODYSSEUS_PROJECTS_ROOT: ${{ runner.temp }}/odysseus-projects
          ODYSSEUS_MARKET_DATA: ${{ runner.temp }}/odysseus-market
        run: |
          hello='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"release","version":"0"}}}'

          { printf '%s\n' "$hello"; sleep 10; } | ./Odysseus.Server > "$RUNNER_TEMP/server-answer.json"

          cat "$RUNNER_TEMP/server-answer.json"

          grep -q '"serverInfo"' "$RUNNER_TEMP/server-answer.json"

      # tar keeps the executable bit, which a zip made here would lose on the way to Linux and macOS.
      - name: Archive
        working-directory: dist
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "odysseus-$VERSION-$RID.zip" odysseus
          else
            tar -czf "odysseus-$VERSION-$RID.tar.gz" odysseus
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: odysseus-${{ matrix.rid }}
          path: |
            dist/odysseus-*.zip
            dist/odysseus-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  nuget:
    if: '!inputs.verify_only'
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      stocksharp: ${{ needs.prepare.outputs.stocksharp }}

  test-tools:
    needs: [prepare, nuget]
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages

      - name: Verify the portable tool packages on this operating system
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./.github/scripts/Test-ToolPackages.ps1 -PackageDirectory packages -Version $env:PACKAGE_VERSION

  publish:
    if: github.event_name == 'push' || (!inputs.dry_run && !inputs.verify_only)
    needs: [prepare, package, nuget, test-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      STOCKSHARP: ${{ needs.prepare.outputs.stocksharp }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          pattern: odysseus-*
          path: archives
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: packages

      - name: Validate the NuGet packages
        shell: pwsh
        run: ./.github/scripts/Test-ToolPackages.ps1 -PackageDirectory packages -Version $env:VERSION -ValidateOnly

      - name: Get a short-lived NuGet publishing key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish the NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($package in Get-ChildItem -LiteralPath packages -Filter '*.nupkg' -File) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json `
              --api-key $env:NUGET_API_KEY --skip-duplicate --timeout 120
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The tag is this commit: already there when a tag started the run, created here when a person did.
      - run: |
          options=()
          if [[ "$VERSION" == *-* ]]; then options+=(--prerelease); fi
          notes="Needs the [.NET 10 runtime](https://dotnet.microsoft.com/download/dotnet/10.0). Unpack the archive for your system and point your agent at \`Odysseus.Server\` in it; the command line is \`odysseus\` beside it.

          NuGet also provides the \`StockSharp.Odysseus.Mcp\` and \`StockSharp.Odysseus.Cli\` .NET tools, each with its worker and runner.

          Built against StockSharp at https://github.com/StockSharp/StockSharp/commit/$STOCKSHARP."

          gh release create "v$VERSION" archives/* packages/*.nupkg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Odysseus $VERSION" \
            --notes "$notes" \
            --generate-notes "${options[@]}"
